<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard e-Learning UST 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
        
        :root { --azul: #1A3A6B; --oro: #C8A951; --fondo: #EEEAE0; --blanco: #ffffff; }
        
        body { font-family: 'DM Sans', sans-serif; background: var(--fondo); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; }
        
        /* HEADER */
        .header { 
            background: var(--azul); color: white; padding: 30px; border-radius: 15px; 
            border-bottom: 5px solid var(--oro); margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        .header p { margin: 5px 0 0; opacity: 0.8; font-size: 14px; }

        /* TABLA */
        .card { background: var(--blanco); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f8f9fa; color: var(--azul); padding: 15px 10px; text-align: left; font-size: 12px; text-transform: uppercase; border-bottom: 2px solid var(--fondo); }
        td { padding: 15px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        
        /* ESTADOS (BADGES) */
        .badge { 
            padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; 
            display: inline-block; text-transform: capitalize;
        }
        .nuevo { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; } /* Azul claro */
        .antiguo { background: #f5f5f5; color: #616161; border: 1px solid #e0e0e0; } /* Gris */
        .pendiente { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; } /* Naranja */
        .error { background: #ffebee; color: #c62828; }

        tr:hover { background-color: #fcfaf5; }
        .facultad-tag { color: var(--oro); font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>UNIVERSIDAD SANTO TOMÁS</h1>
        <p>Seguimiento Semanal — Proyecto e-Learning 2026-1</p>
    </div>

    <div class="card">
        <div id="loading" style="text-align:center; padding:40px;">Cargando datos del proyecto...</div>
        <div id="tabla-container"></div>
    </div>
</div>

<script>
    const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7KLTJADlIkNhjcC_V9X6a-eYiV30pDdOtlOPUsfvy1Z9AY-6TseqeFH-rfZjwtuSjjlQxAw0ym3Tm/pub?gid=1889016436&single=true&output=csv';

    function cargarDatos() {
        Papa.parse(URL_CSV, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                const filas = results.data;
                if(filas.length < 2) return;

                document.getElementById('loading').style.display = 'none';
                
                let html = '<table><thead><tr>';
                html += '<th>Facultad</th>';
                html += '<th>Asignatura</th>';
                html += '<th>Docente</th>';
                html += '<th>Estado/Fmt</th>';
                html += '<th>Diseñador (JP)</th>';
                html += '</tr></thead><tbody>';

                // Empezamos desde la fila 2 para saltar encabezados del Excel
                for(let i = 1; i < filas.length; i++) {
                    const f = filas[i];
                    if(!f[1]) continue; // Si no hay asignatura, saltar

                    // Limpieza de estado para el color
                    const est = (f[3] || '').toLowerCase().trim();
                    let claseBadge = 'badge';
                    if(est.includes('nuevo')) claseBadge += ' nuevo';
                    else if(est.includes('antiguo')) claseBadge += ' antiguo';
                    else if(est.includes('pendiente')) claseBadge += ' pendiente';

                    html += `<tr>
                        <td><span class="facultad-tag">${f[0] || '—'}</span></td>
                        <td><strong>${f[1]}</strong></td>
                        <td>${f[2] || '—'}</td>
                        <td><span class="${claseBadge}">${f[3] || 'S/D'}</span></td>
                        <td>${f[4] || '—'}</td>
                    </tr>`;
                }
                html += '</tbody></table>';
                document.getElementById('tabla-container').innerHTML = html;
            }
        });
    }

    cargarDatos();
    setInterval(cargarDatos, 120000); // Actualiza cada 2 min
</script>

</body>
</html>
