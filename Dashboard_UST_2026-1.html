<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard UST 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body{font-family:sans-serif; background:#EEEAE0; padding:20px}
        .header{background:#1A3A6B; color:white; padding:20px; border-radius:10px; border-bottom:4px solid #C8A951; margin-bottom:20px}
        table{width:100%; border-collapse:collapse; background:white}
        th{background:#F8F6EE; color:#1A3A6B; padding:10px; text-align:left; border-bottom:2px solid #EEE}
        td{padding:10px; border-bottom:1px solid #EEE; font-size:14px}
        .badge{padding:5px 10px; border-radius:15px; font-size:12px; font-weight:bold}
        .Realizada{background:#27A06E; color:white}
        .Agendada{background:#C8A951; color:white}
        .Alerta{background:#D63031; color:white}
    </style>
</head>
<body>
    <div class="header">
        <h1>UNIVERSIDAD SANTO TOMÁS</h1>
        <p>Seguimiento Proyecto e-Learning 2026-1</p>
    </div>
    <div id="tabla-container">Cargando datos desde el Excel...</div>

<script>
    // PEGA AQUÍ TU NUEVO ENLACE QUE TERMINA EN output=csv
    const miExcelCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7KLTJADlIkNhjcC_V9X6a-eYiV30pDdOtlOPUsfvy1Z9AY-6TseqeFH-rfZjwtuSjjlQxAw0ym3Tm/pub?output=csv';

    Papa.parse(miExcelCSV, {
        download: true,
        header: true,
        complete: function(res) {
            let html = '<table><thead><tr><th>Facultad</th><th>Asignatura</th><th>Docente</th><th>Estado</th></tr></thead><tbody>';
            res.data.forEach(fila => {
                if(fila.Asignatura || fila.ASIGNATURA) {
                    html += `<tr>
                        <td>${fila.Facultad || ''}</td>
                        <td><b>${fila.Asignatura || fila.ASIGNATURA || ''}</b></td>
                        <td>${fila.Docente || ''}</td>
                        <td><span class="badge ${fila.Estado}">${fila.Estado || 'S/D'}</span></td>
                    </tr>`;
                }
            });
            html += '</tbody></table>';
            document.getElementById('tabla-container').innerHTML = html;
        }
    });
</script>
</body>
</html>
