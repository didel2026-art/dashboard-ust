<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Proyecto e-Learning UST 2026-1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 20px; }
        .header { background-color: #003057; color: white; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; }
        .btn-refresh { background-color: #00843D; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th { background-color: #00843D; color: white; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background-color: #f9f9f9; }
        .status { font-weight: bold; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Dashboard Proyecto e-Learning UST 2026-1</h1>
    <button class="btn-refresh" onclick="cargarDatos()">↺ Actualizar datos</button>
</div>

<div id="contenedor-tabla">Cargando datos en vivo...</div>

<script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7KLTJADlIkNhjcC_V9X6a-eYiV30pDdOtlOPUsfvy1Z9AY-6TseqeFH-rfZjwtuSjjlQxAw0ym3Tm/pub?output=csv";

    async function cargarDatos() {
        const contenedor = document.getElementById('contenedor-tabla');
        
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                if (results.data.length > 0) {
                    generarTabla(results.data);
                } else {
                    contenedor.innerHTML = "No se encontraron datos en el Sheet.";
                }
            },
            error: function(err) {
                contenedor.innerHTML = "Error al conectar con Google Sheets. Revisa la publicación.";
            }
        });
    }

    function generarTabla(datos) {
        let html = '<table><thead><tr>';
        // Generar encabezados basados en tu Excel
        const columnas = Object.keys(datos[0]);
        columnas.forEach(col => html += `<th>${col}</th>`);
        html += '</tr></thead><tbody>';

        // Generar filas (incluyendo la 25, 26, 27 y nuevas)
        datos.forEach(fila => {
            html += '<tr>';
            columnas.forEach(col => {
                html += `<td>${fila[col] || ''}</td>`;
            });
            html += '</tr>';
        });

        html += '</tbody></table>';
        document.getElementById('contenedor-tabla').innerHTML = html;
    }

    // Carga inicial
    cargarDatos();
</script>

</body>
</html>
