<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard UST 2026-1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap');
        body{ font-family: 'DM Sans', sans-serif; background: #EEEAE0; padding: 20px; color: #1A3A6B; }
        .card{ background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid #C8A951; max-width: 1200px; margin: auto; }
        h1{ font-size: 1.4rem; margin-bottom: 5px; text-align: center; font-weight: 700; }
        table{ width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th{ background: #1A3A6B; color: white; padding: 12px; text-align: left; font-size: 11px; text-transform: uppercase; }
        td{ padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; color: #333; }
        .badge{ padding: 4px 10px; border-radius: 15px; font-size: 10px; font-weight: bold; display: inline-block; min-width: 100px; text-align: center; }
        .bg-realizada{ background: #27A06E; color: white; }
        .bg-agendada{ background: #C8A951; color: white; }
        .bg-alerta{ background: #D63031; color: white; }
        .bg-default{ background: #95a5a6; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h1>UNIVERSIDAD SANTO TOMÁS</h1>
    <p style="text-align:center; opacity:0.7;">Seguimiento Proyecto e-Learning 2026-1</p>
    <div id="loading" style="text-align:center; padding:20px;">Cargando datos desde la hoja "Seguimiento"...</div>
    <div id="tabla-container"></div>
</div>

<script>
    const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7KLTJADlIkNhjcC_V9X6a-eYiV30pDdOtlOPUsfvy1Z9AY-6TseqeFH-rfZjwtuSjjlQxAw0ym3Tm/pub?gid=1889016436&single=true&output=csv';

    function cargarDatos() {
        Papa.parse(URL_CSV, {
            download: true,
            header: false, // Leemos por posición (0, 1, 2...) para no fallar
            skipEmptyLines: true,
            complete: function(results) {
                const filas = results.data;
                if(filas.length < 2) return;

                document.getElementById('loading').style.display = 'none';
                
                let html = '<table><thead><tr>';
                // La primera fila (índice 0) son los encabezados
                html += `<th>${filas[0][0] || 'Facultad'}</th>`;
                html += `<th>${filas[0][1] || 'Asignatura'}</th>`;
                html += `<th>${filas[0][2] || 'Docente'}</th>`;
                html += `<th>${filas[0][3] || 'Estado'}</th>`;
                html += `<th>${filas[0][4] || 'Planificación'}</th>`;
                html += '</tr></thead><tbody>';

                // Recorremos desde la segunda fila
                for(let i = 1; i < filas.length; i++) {
                    const fila = filas[i];
                    if(!fila[1]) continue; // Si no hay nombre de asignatura, saltamos la fila

                    const estado = (fila[3] || '').toLowerCase();
                    let clase = 'bg-default';
                    if(estado.includes('realizada')) clase = 'bg-realizada';
                    else if(estado.includes('agendada') || estado.includes('proceso')) clase = 'bg-agendada';
                    else if(estado.includes('alerta') || estado.includes('sin')) clase = 'bg-alerta';

                    html += `<tr>
                        <td>${fila[0] || '—'}</td>
                        <td><strong>${fila[1]}</strong></td>
                        <td>${fila[2] || '—'}</td>
                        <td><span class="badge ${clase}">${fila[3] || 'S/D'}</span></td>
                        <td>${fila[4] || '—'}</td>
                    </tr>`;
                }
                html += '</tbody></table>';
                document.getElementById('tabla-container').innerHTML = html;
            }
        });
    }

    cargarDatos();
    setInterval(cargarDatos, 60000); // Actualiza cada minuto
</script>

</body>
</html>
